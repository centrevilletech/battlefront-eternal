<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Battlefront Eternal</title>
    <link rel="stylesheet" href="prepare.css" />
    <script type="module" src="prepare.js"></script>
  </head>
  <body>
    <div id="backdrop">
      <div class="art" id="art-a"></div>
      <div class="art" id="art-b"></div>
      <div class="grid"></div>
      <div class="rings"><i></i><i></i><i></i></div>
      <div class="scan"></div>
      <div class="vignette"></div>
    </div>

    <header>
      <div class="brand">BATTLEFRONT<span>ETERNAL</span></div>
      <div class="planet" id="planet"></div>
    </header>

    <main id="panel">
      <h1 id="title">SEARCHING FOR STAR WARS BATTLEFRONT</h1>
      <p id="detail"></p>

      <section id="progress" hidden>
        <div class="bar"><div class="fill" id="fill"></div><div class="glint"></div></div>
        <div class="readout">
          <span id="step"></span>
          <span id="numbers"></span>
        </div>
        <ol id="phases">
          <li data-phase="catalog">GALAXY</li>
          <li data-phase="armies">ARMIES</li>
          <li data-phase="shell">INTERFACE</li>
          <li data-phase="maps">BATTLEFIELDS</li>
          <li data-phase="audio">SOUND</li>
          <li data-phase="textures">TEXTURES</li>
          <li data-phase="movies">MOVIES</li>
        </ol>
      </section>

      <div class="actions" id="actions"></div>
      <button class="link" id="toggle-log" hidden>SHOW DETAILS</button>
      <pre id="log" hidden></pre>
    </main>

    <div id="disk"><div class="ring"></div><div class="ring inner"></div><span>LOADING</span></div>
  </body>
</html>
