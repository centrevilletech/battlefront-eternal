# Desktop packaging for the Electron client (docs/desktop.md).
# Retail data is never packaged: only the engine build and the main process.
appId: com.battlefronteternal.client
productName: Battlefront Eternal
copyright: Battlefront Eternal contributors. Star Wars and the original games belong to their rights holders.
artifactName: Battlefront-Eternal-${version}-${os}-${arch}.${ext}
icon: electron/assets/icon.png

directories:
  output: release
  buildResources: build

# Vite bundles the renderer dependencies. Desktop networking keeps its pure JS
# ws dependency; the network process runs the engine's native UDP transport.
files:
  - package.json
  - dist-desktop/**/*
  - electron/**/*
  - src/net/**/*
  - src/runtime/network-contract.js
  - src/battle-limits.js
  # The presence reads battle URLs as the page does (electron/presence).
  - src/launch.js
  - "!node_modules/three/**/*"
  - "!node_modules/three-mesh-bvh/**/*"
  - "!**/*.map"
asar: true

# The game data preparation: tools/*.py and the toolchain
# (build/fetch-toolchain.mjs) for the platform and architecture being built.
extraResources:
  - from: .host-runtime
    to: host-runtime
    filter: ["**/*"]
  - from: tools
    to: tools
    filter: ["*.py", "content-version.json"]
  - from: toolchain/${os}-${arch}
    to: toolchain
    filter: ["**/*"]
  # The licenses: this project's, the third-party notices and the font's.
  - from: .
    to: legal
    filter: ["LICENSE", "THIRD-PARTY-NOTICES.md"]
  - from: electron/ui/fonts
    to: legal
    filter: ["OFL.txt"]

# The desktop Vite build must exist (npm run build:desktop) and hold no game data.
beforePack: build/check-dist.cjs
# Every build records its own files' hashes (resources/bfe-tree.json), so the
# updater reuses unchanged ones; again after signing, which rewrites binaries.
afterPack: build/tree-index.cjs
afterSign: build/tree-index.cjs

publish:
  provider: github
  owner: centrevilletech
  repo: battlefront-eternal
  releaseType: draft

linux:
  maintainer: "Centreville Tech <josh@lambertmail.xyz>"
  # Updates install per user beside these packages (docs/desktop-updates.md).
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  category: Game
  synopsis: Star Wars Battlefront engine reinvention
  executableName: battlefront-eternal
  desktop:
    entry:
      Name: Battlefront Eternal
      Keywords: battlefront;star wars;swbf;bfe;
  syncDesktopName: true

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Battlefront Eternal

mac:
  # Both supported CPU architectures, outside the App Store. zip is what
  # electron-updater consumes; dmg is for people.
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.action-games
  hardenedRuntime: true
  # Notarization runs when APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID
  # (or the APPLE_API_KEY set) are present in the environment.

deb:
  depends:
    - libc6 (>= 2.28)
    - libgtk-3-0 | libgtk-3-0t64
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0 | libatspi2.0-0t64
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2 (>= 1.0.16)
    - libgbm1
