name: CI

# Runs on GitHub-hosted runners only. No job in this repository may target a
# self-hosted runner: pull requests from forks run the workflow files they
# carry, so a self-hosted label here would hand a stranger's code a machine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    name: Linux Native (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux audio headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libasound2-dev alsa-utils

      - name: Install Rust toolchain
        run: bash build/ci/install-rust.sh

      - name: Cache Cargo registry and build target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: cargo-linux-x64-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            cargo-linux-x64-${{ hashFiles('rust/rust-toolchain.toml') }}-

      - name: Check generated Rust files
        run: bash build/ci/check-generated.sh

      - name: Run Linux native lint, tests, and startup checks
        run: bash build/ci/linux.sh

  linux-arm64:
    name: Linux Native (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install audio and software OpenGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libasound2-dev libegl1 libegl-mesa0 libgl1-mesa-dri libglx-mesa0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libxcb-xkb1 libxcursor1 libxi6 libxinerama1 libxkbcommon0 \
            libxkbcommon-x11-0 libxrandr2 xvfb xauth

      - name: Install Rust toolchain
        run: bash build/ci/install-rust.sh --minimal

      - name: Cache Cargo registry and build target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: cargo-linux-arm64-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            cargo-linux-arm64-${{ hashFiles('rust/rust-toolchain.toml') }}-

      - name: Run arm64 native determinism gate and workspace tests
        run: bash build/ci/linux-arm64.sh

      - name: Build release client for the ARM64 app smoke
        run: cargo build --manifest-path rust/Cargo.toml --locked --release -p bfe-client --bin bfe-client

      - name: Run release app on ARM64 llvmpipe
        run: python3 tools/platform-smoke-native.py --client-bin rust/target/release/bfe-client --output-dir platform-smoke-linux-arm64

      - name: Upload ARM64 app smoke PNGs and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-smoke-linux-arm64
          path: platform-smoke-linux-arm64/
          if-no-files-found: error

  windows:
    name: Windows Native (x86_64 MSVC)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install libvpx source configuration tools
        shell: bash
        run: choco install make --no-progress -y

      - name: Install Rust toolchain
        shell: bash
        env:
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
        run: bash build/ci/install-rust.sh --minimal

      - name: Cache Cargo registry and build target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: cargo-windows-x64-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            cargo-windows-x64-${{ hashFiles('rust/rust-toolchain.toml') }}-

      - name: Build and test Windows native crates
        shell: bash
        env:
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
        run: bash build/ci/windows.sh

      - name: Build release client for the Windows app smoke
        shell: bash
        run: cargo build --manifest-path rust/Cargo.toml --locked --release --target x86_64-pc-windows-msvc -p bfe-client --bin bfe-client

      - name: Install pinned and hash-checked Mesa llvmpipe
        shell: pwsh
        run: ./build/ci/windows-mesa.ps1 -Destination rust/target/x86_64-pc-windows-msvc/release

      - name: Run release app on Windows llvmpipe
        shell: pwsh
        run: python tools/platform-smoke-native.py --client-bin rust/target/x86_64-pc-windows-msvc/release/bfe-client.exe --output-dir platform-smoke-windows-x64

      - name: Upload Windows app smoke PNGs and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-smoke-windows-x64
          path: platform-smoke-windows-x64/
          if-no-files-found: error

  renderer-smoke-native:
    name: Native Software-GL Renderer Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Mesa software OpenGL and Xvfb dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libasound2-dev \
            libegl1 \
            libegl-mesa0 \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libwayland-client0 \
            libwayland-cursor0 \
            libwayland-egl1 \
            libxcb-xkb1 \
            libxcursor1 \
            libxi6 \
            libxinerama1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxrandr2 \
            mesa-utils \
            xvfb

      - name: Install Rust toolchain
        run: bash build/ci/install-rust.sh --minimal

      - name: Cache Cargo registry and build target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: cargo-smoke-linux-x64-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            cargo-smoke-linux-x64-${{ hashFiles('rust/rust-toolchain.toml') }}-
            cargo-linux-x64-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
            cargo-linux-x64-${{ hashFiles('rust/rust-toolchain.toml') }}-

      - name: Build native renderer smoke binaries
        run: |
          cargo build --manifest-path rust/Cargo.toml --locked \
            -p bfe-client --bin render-smoke --bin bfe-client --bin static-frame \
            -p bfe-content-native --example static-fixture --example fingerprint

      - name: Run native software-OpenGL renderer smoke
        run: |
          python3 tools/renderer-smoke-native.py \
            --output renderer-smoke-native.jsonl \
            --png-out renderer-smoke-native.png

      - name: Upload renderer-smoke-native artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renderer-smoke-native
          path: |
            renderer-smoke-native.png
            renderer-smoke-native.jsonl
          if-no-files-found: error
