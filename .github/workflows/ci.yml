name: CI

# Runs on GitHub-hosted runners only. No job in this repository may target a
# self-hosted runner: pull requests from forks run the workflow files they
# carry, so a self-hosted label here would hand a stranger's code a machine.
# Desktop packages are built by release.yml; the project's release host
# signs and publishes them (docs/desktop.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Gameplay, networking and runtime tests (no game files needed)
        run: npm test
      - name: Code-only browser bundle
        run: node --input-type=module -e "import {build} from 'vite'; await build({build:{outDir:'dist-engine-ci',copyPublicDir:false}})"
