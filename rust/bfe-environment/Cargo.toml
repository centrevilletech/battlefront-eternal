[package]
name = "bfe-environment"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "The destruction and weather presentation phase: pooled particle and arc state for the battle renderer"

[lib]
crate-type = ["rlib"]

[dependencies]
jsrt = { path = "../jsrt" }
three = { path = "../three" }
v8math = { path = "../v8math" }
serde_json = { version = "1", features = ["float_roundtrip"] }
