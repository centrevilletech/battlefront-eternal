[package]
name = "v8math-check"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Compares v8math with V8, natively and as WebAssembly"

# The library is the inputs and the functions under test; as WebAssembly
# (cdylib) it is what check-wasm.mjs runs in Node. The binary drives Node
# as the oracle for the native build.
[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "v8math-check"
path = "src/main.rs"

[dependencies]
v8math = { path = "../v8math" }
