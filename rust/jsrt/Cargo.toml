[package]
name = "jsrt"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "The simulation's number semantics, kept from its first (JavaScript) implementation: conversions, rounding, sorts, ordered maps, number text and the game's random streams, bit-identical to V8 13.6."

# A plain library, linked by the simulation and its hosts.
[lib]
crate-type = ["rlib"]

[dependencies]
# V8 13.6's transcendental Math, bit for bit (src/v8math.rs re-exports it).
v8math = { path = "../v8math" }
