[package]
name = "jsrt"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "JavaScript semantics for the Rust simulation port: conversions, rounding, sorts, ordered maps, number text and the game's random streams, bit-identical to V8 13.6."

# A plain library: the sim module links it natively and as WebAssembly.
[lib]
crate-type = ["rlib"]

[features]
default = ["v8math-stub"]
# Until rust/v8math (V8-exact Math) lands, transcendental functions come
# from a clearly marked stub (src/v8math.rs) so the API and the operation
# order around them can be written and tested now. Nothing that must match
# JavaScript bit for bit may ship on the stub: see the module's notes.
v8math-stub = []
