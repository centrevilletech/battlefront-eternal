[package]
name = "bfe-server"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "bfeserver"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bfe-content = { package = "content", path = "../content" }
bfe-content-native = { path = "../bfe-content-native" }
bfe-sim = { package = "sim", path = "../sim" }
bfe-transport = { path = "../bfe-transport" }
ed25519-dalek = "2"
getrandom = "0.2"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
