[package]
name = "bfe-server"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "bfeserver"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bfe-content = { package = "content", path = "../content" }
bfe-content-native = { path = "../bfe-content-native" }
bfe-family = { path = "../bfe-family" }
# The server reads signed payloads as raw JSON. A client built alongside it
# uses that same JSON mode for saved settings.
bfe-storage = { path = "../bfe-storage", features = ["server-json"] }
bfe-sim = { package = "sim", path = "../sim" }
bfe-transport = { path = "../bfe-transport" }
ed25519-dalek = "2"
getrandom = "0.2"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
socket2 = "0.6"
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
# The zero-allocation tests count with the shared test allocator.
bfe-test-alloc = { path = "../bfe-test-alloc" }
# The 2005 battle tests hand the open gate to the servers and worlds they start.
bfe-test-gate = { path = "../bfe-test-gate" }
# The end-to-end match test reads a reply as the client's selection does and
# its snapshots through the client's receiver.
bfe-online = { path = "../bfe-online" }
bfe-presentation = { path = "../bfe-presentation", default-features = false }
bfe-wide = { path = "../bfe-wide" }
