[package]
name = "bfe-online"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Master client, LAN discovery, server ping, direct connect, and server browser model"

[dependencies]
bfe-transport = { path = "../bfe-transport" }
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
