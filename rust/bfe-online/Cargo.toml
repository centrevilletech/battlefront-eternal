[package]
name = "bfe-online"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Master client, LAN discovery, server ping, direct connect, and server browser model"

[dependencies]
bfe-family = { path = "../bfe-family" }
bfe-storage = { path = "../bfe-storage" }
bfe-transport = { path = "../bfe-transport" }
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
# raw_value: a listing's `family` members are kept by their raw text (see `declared`).
serde_json = { version = "1", features = ["raw_value"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
