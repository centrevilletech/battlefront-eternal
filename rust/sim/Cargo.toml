[package]
name = "sim"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# The world simulation library (`bfe_sim`): collision queries, soldier movement,
# pose sampling, and the entity store (`docs/sim-store.md`).
[lib]
name = "bfe_sim"

[features]
# Reading and writing the replay harness's values (rust/sim-replay, native
# only): `cargo test -p sim --features replay` replays captured phases.
replay = ["dep:sim-replay", "bfe-pose/replay"]

[dependencies]
bfe-presentation = { path = "../bfe-presentation" }
serde_json = { version = "1", features = ["float_roundtrip"] }
bfe-pose = { path = "../bfe-pose" }
audio-control = { path = "../audio-control" }
content = { path = "../content" }
v8math = { path = "../v8math" }
three = { path = "../three" }
jsrt = { path = "../jsrt" }
sim-replay = { path = "../sim-replay", optional = true }
