[package]
name = "sim"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# The world simulation's WebAssembly module, bfe_sim: a raw module (no
# wasm-bindgen) that src/sim/module.js instantiates with plain WebAssembly
# APIs, in a worker, a page or Node alike, one instance a battle. It holds
# the collision's queries, the soldiers' movement and the pose sampler
# (once the crates rays and anim) and the entity store the simulation's
# port builds on (docs/sim-store.md). The rlib is for the native tests.
[lib]
name = "bfe_sim"
crate-type = ["cdylib", "rlib"]

[features]
# Reading and writing the replay harness's values (rust/sim-replay, native
# only): `cargo test -p sim --features replay` replays captured phases.
replay = ["dep:sim-replay", "bfe-pose/replay"]
# The navigation port's twin runner (src/bin/nav-twin.rs, tools/nav-twin.mjs),
# off by default so `cargo test` builds no binary beside the tests: the
# release profile aborts on a panic and tests unwind, so the lib would be
# built twice into the same file (cargo's output filename collision), and a
# test could link the other build's dependencies.
nav-twin = []

[[bin]]
name = "nav-twin"
path = "src/bin/nav-twin.rs"
required-features = ["nav-twin"]

[dependencies]
bfe-presentation = { path = "../bfe-presentation", default-features = false }
serde_json = { version = "1", features = ["float_roundtrip"] }
bfe-pose = { path = "../bfe-pose" }
audio-control = { path = "../audio-control" }
# The game's content as JavaScript loads it, and the JavaScript and
# three.js arithmetic its loaders share with the simulation (a body's
# class numbers, units/class.rs).
content = { path = "../content" }
# JavaScript's Math as the production server's V8 computes it.
v8math = { path = "../v8math" }
# three.js r170's math and Object3D transforms, operation by operation
# (the rigs, rig/).
three = { path = "../three" }
# JavaScript's semantics the port keeps (Math.min/max with -0 and NaN,
# ToUint32, V8's sort, the game's random streams and a press's seeded
# draws, a flyer's targets in flight/targeting.rs), from P1's crate.
jsrt = { path = "../jsrt" }
sim-replay = { path = "../sim-replay", optional = true }
