[package]
name = "content"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "The game's content as the world simulation reads it: its files parsed and the numbers derived from them, to the last bit."

# A plain library, linked by the simulation (rust/sim), the client and the
# server.
[lib]
name = "bfe_content"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# V8's Math, bit for bit (hypot, min, max, atan2).
v8math = { path = "../v8math" }
# V8's stable Array.sort, including NaN comparator results in team keys.
jsrt = { path = "../jsrt" }
bfe-family = { path = "../bfe-family" }

[dev-dependencies]
# Only tests/collision.rs, which installs a world in the simulation module's
# collision state (src/install.rs): the simulation module links this crate,
# and a test-only link back is no cycle to cargo.
sim = { path = "../sim" }
