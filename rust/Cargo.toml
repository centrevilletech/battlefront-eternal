[workspace]
resolver = "2"
members = ["bfe-video", "bfe-transport", "bfe-online", "bfe-shell", "bfe-render", "bfe-presentation", "bfe-pose", "bfe-client", "bfe-content-native", "bfe-battle-ui", "sim", "sim-replay", "content", "v8math", "jsrt", "three", "audio", "audio-decode", "basis-transcode", "texture-codec", "image-codec", "bfe-environment", "audio-control", "bfe-desktop", "xtask", "bfe-interface", "bfe-server"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Native builds unwind on a panic: `cargo test --release` builds a crate's
# library once for its tests and its bins alike, which it cannot do with
# the test harness unwinding and the bins aborting (the two builds collide
# in one output file).
debug = false

[workspace.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg"] }
slint-build = "=1.18.1"
i-slint-core = { version = "=1.18.1", default-features = false }
