[package]
name = "bfe-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Desktop operating system services for the native Battlefront Eternal client: paths, settings, content preparation, archive import/export, signed updates, Discord Rich Presence and Steam integration"

[lib]
name = "bfe_desktop"
crate-type = ["rlib"]

[dependencies]
base64 = "0.22"
crc32fast = "1"
ed25519-dalek = "2"
flate2 = "1"
getrandom = "0.2"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
