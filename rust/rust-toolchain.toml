# The Rust release that builds the game, the server and the tools here.
# rustup reads this file for every cargo command run under rust/ and
# installs this release on first use; CI and the release builds use it too
# (build/ci/install-rust.sh), so every build uses the same compiler.
# The wasm32 target is no longer built by anything in this repository.
[toolchain]
channel = "1.99.0"
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
