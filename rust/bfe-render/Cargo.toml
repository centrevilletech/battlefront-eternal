[package]
name = "bfe-render"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Battle renderer: the static world and soldiers drawn through glow"

[dependencies]
three = { path = "../three" }
v8math = { path = "../v8math" }
jsrt = { path = "../jsrt" }
glow = "0.18"
image-webp = "=0.2.4"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
sha2 = "0.10"
