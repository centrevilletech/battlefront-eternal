[package]
name = "bfe-client"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
default-run = "bfe-client"
description = "Window, input and audio device host for the native renderer"

[dependencies]
slint.workspace = true
i-slint-core.workspace = true
bfe-render = { path = "../bfe-render" }
bfe-battle-ui = { path = "../bfe-battle-ui" }
bfe-interface = { path = "../bfe-interface" }
audio = { path = "../audio" }
glow = "0.18"
libloading = "0.8"
glutin = { version = "0.32", default-features = false, features = ["egl", "glx", "x11", "wayland", "wgl"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "glx", "x11", "wayland", "wgl"] }
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "rwh_06"] }
raw-window-handle = "0.6"
cpal = "0.15"
serde_json = "1"

serde = { version = "1", features = ["derive"] }
bfe-content-native = { path = "../bfe-content-native" }
bfe-presentation = { path = "../bfe-presentation", default-features = false }
bfe-pose = { path = "../bfe-pose" }
bfe-shell = { path = "../bfe-shell" }
sha2 = "0.10"
png = "0.18"
fontdue = "0.9"

audio-control = { path = "../audio-control" }
three = { path = "../three" }
jsrt = { path = "../jsrt" }

bfe-environment = { path = "../bfe-environment" }

bfe-transport = { path = "../bfe-transport" }
bfe-online = { path = "../bfe-online" }
sim = { path = "../sim" }
content = { path = "../content" }

base64 = "0.22"
bfe-desktop = { path = "../bfe-desktop" }

# Native clipboard text only; image support is unnecessary for single-line fields.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Reuse the Xlib connection behind winit's X11 window; other backends do not load it.
x11-dl = "2.21"

[build-dependencies]
slint-build.workspace = true
