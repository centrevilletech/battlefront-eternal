[package]
name = "bfe-native"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Replays a captured battle scene through bfe-render on native OpenGL ES, to measure its CPU cost outside the browser"

[dependencies]
bfe-render = { path = "../bfe-render" }
glow = "0.18"
glutin = { version = "0.32", default-features = false, features = ["egl"] }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
