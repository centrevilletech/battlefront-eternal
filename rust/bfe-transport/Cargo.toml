[package]
name = "bfe-transport"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "BFE-UDP/1 client transport and shared wire layouts"

[dependencies]
aes-gcm = "0.10"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
crc32fast = "1"
base64 = "0.22"
getrandom = "0.2"
serde_json = "1"
