[package]
name = "basis-transcode"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "KTX2 Basis Universal transcoding for renderer resources"

[build-dependencies]
cc = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
basisu_wasm_libcxx = "=0.1.0"

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
